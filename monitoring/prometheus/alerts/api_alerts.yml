groups:
  - name: pets_api_alerts
    interval: 30s
    rules:
      - alert: ServiceDown
        expr: up{job="django-api"} == 0
        for: 1m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Pets API недоступен"
          description: "Prometheus не может получить метрики с Django API более 1 минуты"
          runbook_url: "https://github.com/pinocoladium/pets-search-service-backend"

      - alert: HighErrorRate
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) * 100 > 5
        for: 5m
        labels:
          severity: critical
          team: backend
        annotations:
          summary: "Высокий уровень ошибок API"
          description: "Доля 5xx ошибок превышает 5%"
          runbook_url: "https://github.com/pinocoladium/pets-search-service-backend"

      - alert: HighLatency
        expr: |
          histogram_quantile(
            0.95,
            sum(rate(django_http_requests_latency_seconds_by_view_method_bucket[5m])) by (le)
          ) > 0.5
        for: 10m
        labels:
          severity: warning
          team: backend
        annotations:
          summary: "Высокая задержка API"
          description: "95-й перцентиль времени ответа API превышает 500 мс"
          runbook_url: "https://github.com/pinocoladium/pets-search-service-backend"

      - alert: ManyComplaints
        expr: complaints_total > 20
        for: 10m
        labels:
          severity: warning
          team: support
        annotations:
          summary: "Большое количество жалоб"
          description: "Количество жалоб в системе превысило 20"
          runbook_url: "https://github.com/pinocoladium/pets-search-service-backend"

      - alert: SuspiciousErrorSpike
        expr: |
          (
            sum(rate(django_http_responses_total_by_status_total{status=~"5.."}[5m]))
            /
            sum(rate(django_http_responses_total_by_status_total[5m]))
          ) * 100 > 10
        for: 2m
        labels:
          severity: critical
          type: security
          team: backend
        annotations:
          summary: "Подозрительный рост ошибок"
          description: "Доля 5xx ошибок превысила 10%. Возможна атака, сканирование уязвимостей или некорректные запросы к API."
          runbook_url: "https://github.com/pinocoladium/pets-search-service-backend"